<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdos</title>
</head>
<body>
    <main>
        <article>
            <table border="1" style="width: 100%;">
                <tr>
                    <th style="background-color: blueviolet; color: white;" align="center">Cabeçalho 1</th>
                    <th style="background-color: blueviolet; color: white;" align="center">Cabeçalho 2</th>
                    <th style="background-color: blueviolet; color: white;" align="center">Cabeçalho 3</th>
                </tr>
                <tr>
                    <th style="background-color: black; color: white;" align="left">Conteúdo 1</th>
                    <td>
                        <table border="1" style="width: 100%;">
                            <tr>
                                <td style="background-color: yellow;" align="left">1</td>
                                <td style="background-color: red;" align="right">2</td>
                            </tr>
                            <tr>
                                <td style="background-color: blue;" align="right">3</td>
                                <td style="background-color: green;" align="left">4</td>
                            </tr>
                        </table>
                    </td>
                    <td>Conteúdo 3</td>
                </tr>
                <tr>
                    <th style="background-color: black; color: white;" align="left">Conteúdo 2</th>
                    <td align="right">Conteúdo 5</td>
                    <td>
                        <table border="1" style="width: 100%;">
                            <tr>
                                <td style="background-color: orange;" align="center">5</td>
                                <td style="background-color: pink;" align="left">6</td>
                            </tr>
                            <tr>
                                <td style="background-color: deeppink;" align="right">7</td>
                                <td style="background-color: orange;" align="center">8</td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </article>
    </main>
</body>
</html>
